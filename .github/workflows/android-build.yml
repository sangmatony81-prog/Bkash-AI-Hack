- name: Set up Gradle
  uses: gradle/actions/setup-gradle@v4
  with:
    validate-wrappers: false    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Build Logs on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: build/
